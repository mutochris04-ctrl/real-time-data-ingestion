# PostgreSQL for the streaming lab, in Docker.
# Start:  docker compose up -d      Stop:  docker compose down
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "5435:5432"   # 5435 on my PC (5432 = my own PostgreSQL, 5433/5434 are already used)
    volumes:
      # Docker runs this file the first time the container starts: it creates all the tables
      - ./postgres_setup.sql:/docker-entrypoint-initdb.d/postgres_setup.sql
      # The data is kept here, even after "docker compose down"
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
